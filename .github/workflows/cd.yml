name: Continuous Delivery Pipeline (CD)

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  continuous-integration:
    name: 1. Verificación de Calidad (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm test

  build-and-package:
    name: 2. Construcción de Artefacto Inmutable
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Construir Proyecto
        run: |
          npm ci 
          npm run build --if-present

      - name: Guardar Artefacto de Producción (Release Bundle)
        uses: actions/upload-artifact@v3
        with:
          name: release-build-${{ github.sha }}
          path: dist/ # O la carpeta de salida según el framework (build/ / public/)

  deploy-to-staging:
    name: 3. Despliegue Automatizado a Staging
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Desplegar en Vercel / Render / Cloud
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          zeit-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
