
name: Continuous Delivery Pipeline (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  continuous-integration:
    name: 1. Verificación de Calidad (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm test

  build-and-package:
    name: 2. Construcción de Artefacto Inmutable
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Construir Proyecto
        run: |
          mkdir release
          cp -r *.js package.json package-lock.json release/

      - name: Guardar Artefacto de Producción
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  deploy-to-staging:
    name: 3. Despliegue Automatizado a Staging
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Desplegar en Vercel (Staging)
        uses: amondnet/vercel-action@v20
        with:
         vercel-token: ${{ secrets.VERCEL_TOKEN }}
         zeit-token: ${{ secrets.VERCEL_TOKEN }}
         vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
         vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
